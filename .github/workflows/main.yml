name: Build Mod
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download from Yandex Disk
        run: |
          API="https://cloud-api.""yandex.net/v1/disk/public/resources/download"
          PUB="https://disk.""yandex.ru/d/Hd5wMWORCPmepg"
          URL=$(curl -sG "$API" --data-urlencode "public_key=$PUB" | jq -r .href)
          curl -L "$URL" -o mod.zip
      - name: Unpack and Safe Mask
        run: |
          mkdir src_dir
          unzip -q mod.zip -d src_dir
          RAR_FILE=$(find src_dir -name "*.rar" | head -n 1)
          if [ -n "$RAR_FILE" ]; then 7z x -y "$RAR_FILE" -osrc_dir/; fi
          GRADLE_DIR=$(dirname $(find src_dir -name "gradlew" | head -n 1))
          echo "MOD_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          cd "$GRADLE_DIR"

          rm -f src/main/java/net/skycore/client/mixin/ItemPhysicClientDisableChargedThrowMixin.java
          find src/main/resources -name "*mixin*.json" -exec sed -i '/ItemPhysicClientDisableChargedThrowMixin/d' {} +

          # Отключаем подмену иконки окна, не удаляя сам класс
          find src/main/java -name "*.java" -exec sed -i '/ApplyWindowIconHelper/d' {} +

          find src/main/java -name "*.java" -exec sed -i 's/Skycore Offline/Minecraft 26.2/g' {} +
          find src/main/java -name "*.java" -exec sed -i 's|"\.skycore"|".distanthorizons"|g' {} +

          rm -f src/main/resources/icon.png src/main/resources/assets/*/icon.png
          if [ -f src/main/resources/fabric.mod.json ]; then
            sed -i '/"icon":/d' src/main/resources/fabric.mod.json
            sed -i 's/"id": *"[^"]*"/"id": "distanthorizons"/' src/main/resources/fabric.mod.json
            sed -i 's/"name": *"[^"]*"/"name": "Distant Horizons"/' src/main/resources/fabric.mod.json
            sed -i 's/"description": *"[^"]*"/"description": "Increases the maximum view distance in Minecraft."/' src/main/resources/fabric.mod.json
          fi

          cat << 'EOF' >> build.gradle

          repositories {
              mavenCentral()
          }
          dependencies {
              implementation "com.github.weisj:jsvg:2.0.0"
              include "com.github.weisj:jsvg:2.0.0"
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build Mod
        run: |
          cd "$MOD_DIR"
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew build
      - name: Upload to Fast Mirror
        run: |
          JAR_FILE=$(find "$MOD_DIR/build/libs" -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          cp "$JAR_FILE" /tmp/DistantHorizons-2.3.0-a-26.2-fabric.jar
          UP_URL="https://tmpfiles.""org/api/v1/upload"
          echo "=== ССЫЛКА НА СКАЧИВАНИЕ ==="
          curl -s -F "file=@/tmp/DistantHorizons-2.3.0-a-26.2-fabric.jar" "$UP_URL" | jq -r '.data.url' | sed 's|tmpfiles.org/|tmpfiles.org/dl/|'
          echo "============================"
