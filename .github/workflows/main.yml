name: Build Mod
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download from Yandex Disk
        run: |
          API="https://cloud-api.""yandex.net/v1/disk/public/resources/download"
          PUB="https://disk.""yandex.ru/d/Hd5wMWORCPmepg"
          URL=$(curl -sG "$API" --data-urlencode "public_key=$PUB" | jq -r .href)
          curl -L "$URL" -o mod.zip
      - name: Unpack and Patch
        run: |
          mkdir src_dir
          unzip -q mod.zip -d src_dir
          RAR_FILE=$(find src_dir -name "*.rar" | head -n 1)
          if [ -n "$RAR_FILE" ]; then 7z x -y "$RAR_FILE" -osrc_dir/; fi
          GRADLE_DIR=$(dirname $(find src_dir -name "gradlew" | head -n 1))
          echo "MOD_DIR=$GRADLE_DIR" >> $GITHUB_ENV
          cd "$GRADLE_DIR"
          rm -f src/main/java/net/skycore/client/mixin/ItemPhysicClientDisableChargedThrowMixin.java
          find src/main/resources -name "*mixin*.json" -exec sed -i '/ItemPhysicClientDisableChargedThrowMixin/d' {} +
          cat << 'EOF' >> build.gradle

          repositories {
              mavenCentral()
          }
          dependencies {
              implementation "com.github.weisj:jsvg:1.7.1"
              include "com.github.weisj:jsvg:1.7.1"
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build Mod
        run: |
          cd "$MOD_DIR"
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: Ready-Mod
          path: "**/build/libs/*.jar"
